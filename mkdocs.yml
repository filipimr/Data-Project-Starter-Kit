# TODO: defina repo_url (ex.: https://github.com/<usuario>/<repo>) ao publicar
# no GitHub — sem ela, o Material não mostra o link/ícone do repositório.
site_name: Data Project Starter Kit
site_description: Template padronizado para projetos de engenharia, ciência e análise de dados.
repo_name: Data-Project-Starter-Kit

nav:
  - Início: index.md
  - Guia de boas práticas: guia-boas-praticas.md
  - Estrutura do projeto: estrutura.md
  - Pipeline: pipeline.md
  - IA como acelerador: ia-como-acelerador.md

theme:
  name: material
  language: pt-BR
  # font: false desliga o carregamento automático de Roboto/Roboto Mono do
  # Material — a tipografia é 100% controlada por docs/stylesheets/extra.css.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.details
