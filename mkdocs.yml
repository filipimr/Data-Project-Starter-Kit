site_name: Data Project Starter Kit
site_description: Template padronizado para projetos de engenharia, ciência e análise de dados.
repo_name: DataProjectStarterKit
repo_url: https://github.com/filipimr/Data-Project-Starter-Kit

nav:
  - Introdução: index.md
  - Estrutura do projeto: estrutura.md
  - Guia de boas práticas:
      - Visão geral: guia/index.md
      - 1. Fundação do ambiente: guia/fundacao.md
      - 2. Código profissional: guia/codigo.md
      - 3. Garantia de qualidade: guia/qualidade.md
      - 4. Documentação viva: guia/documentacao.md
      - 5. Fluxo e colaboração: guia/colaboracao.md
      - Retrofit e Adoção: guia/retrofit.md
      - Checklist: guia/checklist.md
  - Pipeline: pipeline.md
  - IA como acelerador: ia-como-acelerador.md

theme:
  name: material
  language: pt-BR
  # font: false desliga o carregamento automático de Roboto/Roboto Mono do
  # Material — a tipografia é 100% controlada por docs/stylesheets/extra.css.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.path
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - content.code.annotate
    - toc.follow
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.details

