[project]
name = "data-project-starter-kit"
version = "0.1.0"
description = "Template padronizado para projetos de engenharia, ciência e análise de dados."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.5",
    "mkdocstrings[python]>=1.0.6",
    "pre-commit>=4.6.1",
    "pygments>=2.20.0",
    "pymdown-extensions>=11.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "taskipy>=1.14.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E=estilo  F=erros  I=imports  D=docstrings  UP=modernização  B=bugs  S=segurança
select = ["E", "F", "I", "D", "UP", "B", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.taskipy.tasks]
format = "ruff check --fix . && ruff format ."
lint = "ruff check . && ruff format --check ."
test = "pytest -v"
docs = "mkdocs serve"
init = "python scripts/bootstrap.py"
